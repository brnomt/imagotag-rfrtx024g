; ESP32-C3 Super Mini + Pervasive 2.66" iTC panel (SE2266JS0C1 / E2266JS0C1)

[env:esp32c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1   ; 4 MB flash, RISC-V, matches the Super Mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial goes over the native USB-C port
    -D ARDUINO_USB_MODE=1
    -D EPD_CONTROLLER=3            ; 3 = iTC, 1 = SSD16xx, 2 = UC8151
    -D EPD_WIDTH=296
    -D EPD_HEIGHT=152

; A/B test: CS and D/C swapped in software, for a suspected wiring mix-up
[env:esp32c3-swap-csdc]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SWAP_CS_DC=1

; A/B test: explicit power setting + booster soft start before 0x04
[env:esp32c3-itc-pwr]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_ITC_POWER_SETTINGS=1

; A/B test: ignore BUSY, refresh on fixed delays
[env:esp32c3-itc-blind]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_IGNORE_BUSY=1

; A/B test: same, with a 30 s refresh window
[env:esp32c3-itc-blind30]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_IGNORE_BUSY=1
    -D EPD_BLIND_MS=30000

; Geometry calibration image at boot
[env:esp32c3-cal]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_BOOT_DEMO=1

; Same, at 1 MHz, in case 4 MHz is corrupting the burst
[env:esp32c3-cal-slow]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_BOOT_DEMO=1
    -D EPD_SPI_HZ=1000000

; Calibration image driven as UC8151/IL0373 instead of iTC
[env:esp32c3-uc8151-cal]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_BOOT_DEMO=1
    -D EPD_CONTROLLER=2
    -D EPD_BUSY_ACTIVE_HIGH=0
    -D EPD_SPI_HZ=1000000

; Uniform black frame: immune to layout, bit order and polarity
[env:esp32c3-black]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_BOOT_DEMO=2

; Boot straight into the pin wiggle, for continuity checks with a meter
[env:esp32c3-wiggle]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_BOOT_WIGGLE=1

; Boot into the step-by-step BUSY diagnostics
[env:esp32c3-diag]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_BOOT_DIAG=1

; Slow bus with setup/hold margins, for noisy wiring
[env:esp32c3-slow]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10

; Slow bus + solid black frame
[env:esp32c3-slow-black]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_BOOT_DEMO=2

; Slow bus, greeting, Y flipped inside each byte
[env:esp32c3-flipy]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_Y=1

; Slow bus + geometry calibration
[env:esp32c3-slow-cal]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_BOOT_DEMO=1

; Slow bus + greeting, whole image mirrored vertically
[env:esp32c3-vflip]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_Y_AXIS=1

; Orientation markers: top bar, left bar, big F
[env:esp32c3-marker]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_BOOT_DEMO=4

; Markers with 180 deg rotation and inverted colours
[env:esp32c3-mark2]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_BOOT_DEMO=4
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1

; Corrected orientation: vertical mirror + inverted colours, no X flip
[env:esp32c3-final]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1

; Corner numerals 1..4, same transform as the final build
[env:esp32c3-quad]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BOOT_DEMO=5

; Same text at scale 4 and scale 2, to isolate a size effect
[env:esp32c3-scaletest]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BOOT_DEMO=6
    -D EPD_BUILD_TAG=10

; Greeting with build tag, for confirming the frame actually changed
[env:esp32c3-tagged]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BUILD_TAG=11

; Panel VDD wired straight to GPIO3 (active high), no MOSFET
[env:esp32c3-direct]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BUILD_TAG=12
    -D EPD_PIN_PWR=3
    -D EPD_PWR_ON_LEVEL=HIGH

; Uppercase greeting with build tag 13
[env:esp32c3-upper]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BUILD_TAG=13
    -D EPD_PIN_PWR=3
    -D EPD_PWR_ON_LEVEL=HIGH

; Lowercase alphabet, build tag 14
[env:esp32c3-alpha]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BUILD_TAG=14
    -D EPD_PIN_PWR=3
    -D EPD_PWR_ON_LEVEL=HIGH
    -D EPD_BOOT_DEMO=7

; Final greeting, build tag 15
[env:esp32c3-good]
extends = env:esp32c3-supermini
build_flags =
    ${env:esp32c3-supermini.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_DELAY_US=10
    -D EPD_FLIP_X=0
    -D EPD_FLIP_Y_AXIS=1
    -D EPD_INVERT=1
    -D EPD_BUILD_TAG=15
    -D EPD_PIN_PWR=3
    -D EPD_PWR_ON_LEVEL=HIGH
