; ESP32-C3 Super Mini driving a SES-imagotag VUSION 2.6" e-paper panel
; (Pervasive iTC controller, 296x152 BWR).
;
; Build:  pio run -d firmware
; Flash:  pio run -d firmware -t upload

[platformio]
default_envs = release

[env:release]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Geometry test pattern instead of the identification card.
[env:pattern]
extends = env:release
build_flags =
    ${env:release.build_flags}
    -D EPD_BOOT_DEMO=1

; Conservative bus timing for long jumper wires or a noisy supply.
[env:slow]
extends = env:release
build_flags =
    ${env:release.build_flags}
    -D EPD_SPI_HZ=500000
    -D EPD_CS_SETUP_US=30

; Bench prototype: panel VDD tied straight to GPIO 3, no MOSFET (active high).
; The GPIO current limit is well below the refresh peak, so use this only to
; bring up a board. See hardware/README.md.
[env:direct]
extends = env:release
build_flags =
    ${env:release.build_flags}
    -D EPD_PANEL_POWER_ACTIVE_LOW=0
